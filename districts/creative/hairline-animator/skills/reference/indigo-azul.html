<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INDIGO AZUL - hairline intro</title>
<style>
  :root {
    --bg: #fafaf7;
    --ink: #2f2a6e;
    --ink-soft: #4a4490;
  }
  [data-theme="dark"] {
    --bg: #0e0d1a;
    --ink: #8f89e8;
    --ink-soft: #6f69c8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); transition: background .6s; }
  #stage { position: fixed; inset: 0; display: block; cursor: crosshair; touch-action: none; }

  /* Intro overlay */
  #intro {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: var(--bg); z-index: 10; transition: opacity 1.1s ease; pointer-events: none;
  }
  #intro.done { opacity: 0; }
  #intro svg { width: min(82vw, 720px); height: auto; }
  #intro text {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 200; letter-spacing: .35em;
    fill: transparent; stroke: var(--ink); stroke-width: 1;
    stroke-dasharray: 340; stroke-dashoffset: 340;
    animation: draw 2.2s ease forwards, fillin .9s ease 2.0s forwards;
  }
  #intro .sub {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 300; letter-spacing: .5em; font-size: 11px;
    fill: transparent; stroke: none;
    animation: fillin .8s ease 2.6s forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes fillin { to { fill: var(--ink); } }

  /* Header after intro */
  #brand {
    position: fixed; top: 18px; left: 22px; z-index: 5;
    background: color-mix(in srgb, var(--bg) 72%, transparent);
    padding: 4px 10px; border-radius: 999px;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 200; letter-spacing: .35em; font-size: 14px; color: var(--ink);
    opacity: 0; transition: opacity 1s ease .2s; user-select: none;
  }
  #brand.on { opacity: 1; }

  /* Controls */
  #controls {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 14px; align-items: center; z-index: 5;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: color-mix(in srgb, var(--bg) 78%, transparent);
    border: 1px solid var(--ink); border-radius: 999px;
    padding: 8px 16px; opacity: 0; transition: opacity 1s ease .4s;
  }
  #controls.on { opacity: 1; }
  #controls label { font-size: 10px; letter-spacing: .18em; color: var(--ink-soft); text-transform: uppercase; }
  #intensity { width: 110px; accent-color: var(--ink); }
  #theme {
    border: 1px solid var(--ink); background: transparent; color: var(--ink);
    border-radius: 999px; padding: 4px 12px; font-size: 10px; letter-spacing: .18em;
    text-transform: uppercase; cursor: pointer;
  }
  @media (prefers-reduced-motion: reduce) { #intro text { animation-duration: .01s; } }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="intro">
  <svg viewBox="0 0 720 160">
    <text x="360" y="88" text-anchor="middle" font-size="54">INDIGO AZUL</text>
    <text class="sub" x="360" y="126" text-anchor="middle">PUERTO VALLARTA</text>
  </svg>
</div>

<div id="brand">INDIGO AZUL</div>

<div id="controls">
  <label for="intensity">intensity</label>
  <input id="intensity" type="range" min="0" max="100" value="55">
  <button id="theme" type="button">dark</button>
</div>

<script>
(function () {
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  if (!ctx) { console.error('INDIGO AZUL: 2d canvas context unavailable'); return; }
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0;

  var pointer = { x: -9999, y: -9999 };
  var intensity = 0.55;
  var rosettes = [];
  var t0 = performance.now();

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    build();
  }

  // One tillandsia bulbosa rosette: a bulb base plus curly leaves,
  // precomputed as normalized strokes around the origin (unit ~1 = leaf length).
  function makeRosette(seed) {
    var rnd = mulberry(seed);
    var leaves = [];
    var n = 9 + Math.floor(rnd() * 4);
    for (var i = 0; i < n; i++) {
      var a = (i / n) * Math.PI * 2 + rnd() * 0.35;
      var len = 0.75 + rnd() * 0.45;
      var curl = (rnd() - 0.5) * 1.9;
      leaves.push({ a: a, len: len, curl: curl, wob: rnd() * Math.PI * 2 });
    }
    return { leaves: leaves, bulb: 0.16 + rnd() * 0.05 };
  }
  function mulberry(s) {
    return function () {
      s |= 0; s = (s + 0x6D2B79F5) | 0;
      var t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function build() {
    rosettes = [];
    var gap = Math.max(96, Math.min(175, W / 6.5));
    var iso = 0.5; // isometric squash
    var cols = Math.ceil(W / gap) + 2;
    var rows = Math.ceil(H / (gap * iso)) + 3;
    var seed = 7;
    for (var r = -1; r < rows; r++) {
      for (var c = -1; c < cols; c++) {
        var x = c * gap + (r % 2 ? gap / 2 : 0);
        var y = r * gap * iso + gap * 0.4;
        var size = gap * (0.26 + ((seed * 37 + r * 11 + c * 7) % 13) / 68);
        rosettes.push({
          x: x, y: y, size: size,
          ros: makeRosette(seed * 1000 + r * 97 + c * 13),
          ang: 0, target: 0, lift: 0, liftTarget: 0
        });
        seed++;
      }
    }
  }

  function ink() {
    return getComputedStyle(document.documentElement).getPropertyValue('--ink').trim();
  }

  function drawRosette(rt, t) {
    var s = rt.size * (1 + rt.lift * 0.35);
    ctx.save();
    ctx.translate(rt.x, rt.y - rt.lift * 10);
    ctx.rotate(rt.ang);
    ctx.strokeStyle = ink();
    ctx.lineWidth = 1;
    // bulb base
    ctx.beginPath();
    ctx.ellipse(0, 0, rt.ros.bulb * s, rt.ros.bulb * s * 0.72, 0, 0, Math.PI * 2);
    ctx.stroke();
    // curly leaves
    for (var i = 0; i < rt.ros.leaves.length; i++) {
      var L = rt.ros.leaves[i];
      var sway = Math.sin(t * 0.0009 + L.wob) * 0.06;
      var a = L.a + sway;
      var dx = Math.cos(a), dy = Math.sin(a);
      var px = -dy, py = dx;
      var tipX = dx * L.len * s, tipY = dy * L.len * s * 0.86;
      var c1x = dx * L.len * 0.45 * s + px * L.curl * s * 0.30;
      var c1y = dy * L.len * 0.45 * s * 0.86 + py * L.curl * s * 0.30;
      var c2x = dx * L.len * 0.8 * s - px * L.curl * s * 0.42;
      var c2y = dy * L.len * 0.8 * s * 0.86 - py * L.curl * s * 0.42;
      ctx.beginPath();
      ctx.moveTo(dx * rt.ros.bulb * s * 0.6, dy * rt.ros.bulb * s * 0.5);
      ctx.bezierCurveTo(c1x, c1y, c2x, c2y, tipX, tipY);
      ctx.stroke();
    }
    ctx.restore();
  }

  var RADIUS = 260;
  function frame(t) {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < rosettes.length; i++) {
      var rt = rosettes[i];
      var dx = pointer.x - rt.x, dy = pointer.y - rt.y;
      var d = Math.sqrt(dx * dx + dy * dy);
      var f = Math.max(0, 1 - d / RADIUS);
      rt.target = f > 0 ? Math.atan2(dy, dx) * f * intensity * 1.4 : 0;
      rt.liftTarget = f * intensity;
      rt.ang += (rt.target - rt.ang) * 0.075;
      rt.lift += (rt.liftTarget - rt.lift) * 0.075;
      drawRosette(rt, t);
    }
    raf = requestAnimationFrame(frame);
  }

  function setPointer(x, y) { pointer.x = x; pointer.y = y; }
  window.addEventListener('pointermove', function (e) { setPointer(e.clientX, e.clientY); }, { passive: true });
  window.addEventListener('touchmove', function (e) {
    if (e.touches[0]) setPointer(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  window.addEventListener('pointerleave', function () { setPointer(-9999, -9999); });
  window.addEventListener('resize', resize);

  document.getElementById('intensity').addEventListener('input', function (e) {
    intensity = e.target.value / 100;
  });
  document.getElementById('theme').addEventListener('click', function () {
    var el = document.documentElement;
    var dark = el.getAttribute('data-theme') === 'dark';
    el.setAttribute('data-theme', dark ? '' : 'dark');
    this.textContent = dark ? 'dark' : 'light';
  });

  var raf = 0;
  function onVisibility() {
    if (document.hidden) {
      cancelAnimationFrame(raf);
      raf = 0;
    } else if (!raf) {
      raf = requestAnimationFrame(frame);
    }
  }
  document.addEventListener('visibilitychange', onVisibility);

  resize();
  raf = requestAnimationFrame(frame);

  // Intro sequence: draw-on runs on CSS; lift the overlay when the title
  // finishes animating, with a fallback if no animation event fires.
  var introLifted = false;
  function liftIntro() {
    if (introLifted) return;
    introLifted = true;
    document.getElementById('intro').classList.add('done');
    document.getElementById('brand').classList.add('on');
    document.getElementById('controls').classList.add('on');
  }
  var introTitle = document.querySelector('#intro text');
  if (introTitle) introTitle.addEventListener('animationend', liftIntro, { once: true });
  setTimeout(liftIntro, 5000);
})();
</script>
</body>
</html>
