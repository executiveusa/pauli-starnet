name: secret-history

on:
  pull_request:
  push:
    branches: [main, feat/harness-backend]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and verify Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz'
          curl --fail --location --silent --show-error "$url" --output gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan full reachable history
        run: ./gitleaks git . --no-banner --redact --report-format json --report-path gitleaks-report.json
      - name: Print leak metadata only
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const p = 'gitleaks-report.json';
          if (!fs.existsSync(p)) { console.log('no gitleaks report'); process.exit(0); }
          const rows = JSON.parse(fs.readFileSync(p, 'utf8'));
          console.log('findings=' + rows.length);
          for (const r of rows) {
            console.log(JSON.stringify({
              RuleID: r.RuleID,
              Description: r.Description,
              File: r.File,
              StartLine: r.StartLine,
              EndLine: r.EndLine,
              Commit: r.Commit,
              Author: r.Author,
              Date: r.Date,
              Message: r.Message,
              Fingerprint: r.Fingerprint
            }));
          }
          NODE
