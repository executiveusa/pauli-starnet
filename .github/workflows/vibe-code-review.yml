name: Vibe Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: vibe-code-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: OpenCodeReview
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Review pull request
        uses: executiveusa/open-code-review@2d685ab0d057aec8255f18cd0a5f5a14fbfd5195
        with:
          ocr_version: "1.11.8"   # exact integrity-locked package version
          llm_url: https://api.groq.com/openai/v1/chat/completions
          llm_model: openai/gpt-oss-20b
          llm_use_anthropic: "false"
          llm_auth_token: ${{ secrets.GROQ_API_KEY }}
          llm_extra_body: '{"reasoning_effort":"low"}'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          language: English
          review_concurrency: "1"
          sticky_summary: "true"
          incremental: "true"
          upload_artifacts: "true"
          route_severity_below: low
          route_categories: style,documentation
