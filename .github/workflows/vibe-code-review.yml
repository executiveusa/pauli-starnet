name: Vibe Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: vibe-code-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    uses: executiveusa/open-code-review/.github/workflows/vibe-code-review.yml@864933213372cc488b3f2f2b1deaab84ea91b855
    with:
      ocr_version: "1.11.8"   # exact integrity-locked package version
      llm_url: https://openrouter.ai/api/v1/chat/completions
      model: nvidia/nemotron-3-super-120b-a12b:free   # bash lane, verified live 2026-09-27 (golden mission + crew); nano-omni slug was timing out the gate
      review_concurrency: "1"   # serial review keeps the burst under free-tier token/min caps
    secrets:
      llm_token: ${{ secrets.OPENROUTER_API_KEY }}
