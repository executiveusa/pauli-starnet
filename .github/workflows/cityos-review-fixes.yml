name: City OS Review Fixes

on:
  push:
    branches:
      - pauli/paulis-place-city-os-20260830
    paths:
      - .github/workflows/cityos-review-fixes.yml

permissions:
  contents: write

jobs:
  repair-and-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pauli/paulis-place-city-os-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply bounded review fixes
        run: python3 .github/scripts/fix_cityos_review.py
      - name: Syntax and focused proof
        run: |
          node --check frontend/app/cityos.js
          node --check frontend/app/stationcommands.js
          node --check frontend/app/app.js
          node test/cityos-live-registration.test.js
          for t in test/cityos.test.js test/worldmodel.test.js test/station-tools.test.js test/station-command.test.js test/website-app-sync.test.js test/orchestration.test.js; do
            if [ -f "$t" ]; then echo "== $t =="; node "$t"; fi
          done
      - name: Commit verified repair
        run: |
          rm .github/workflows/cityos-review-fixes.yml .github/scripts/fix_cityos_review.py
          git config user.name "pauli-city-os-bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/app/cityos.js website/app/app/cityos.js frontend/app/app.js website/app/app/app.js frontend/app/stationcommands.js website/app/app/stationcommands.js test/cityos-live-registration.test.js .github/workflows/cityos-review-fixes.yml .github/scripts/fix_cityos_review.py
          git commit -m "fix: close City OS ownership routing and durability gates"
          git push origin HEAD:pauli/paulis-place-city-os-20260830
